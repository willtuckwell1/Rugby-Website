<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Stylized rugby ball on a field</title>
  <desc id="desc">A simple illustration of a rugby ball with green field stripes.</desc>
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6b3c"/>
      <stop offset="100%" stop-color="#235330"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e7cc"/>
      <stop offset="100%" stop-color="#c9b48a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16311f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#grass)"/>
  <g opacity="0.18">
    <rect y="110" width="1200" height="12" fill="#ffffff"/>
    <rect y="250" width="1200" height="12" fill="#ffffff"/>
    <rect y="390" width="1200" height="12" fill="#ffffff"/>
    <rect y="530" width="1200" height="12" fill="#ffffff"/>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="355" rx="320" ry="150" fill="url(#ball)" transform="rotate(-12 600 355)"/>
    <ellipse cx="600" cy="355" rx="300" ry="130" fill="none" stroke="#8a6b42" stroke-width="8" transform="rotate(-12 600 355)"/>
    <path d="M420 355h360" stroke="#8a6b42" stroke-width="14" stroke-linecap="round" transform="rotate(-12 600 355)"/>
    <path d="M545 305v100M585 295v120M625 295v120M665 305v100" stroke="#8a6b42" stroke-width="10" stroke-linecap="round" transform="rotate(-12 600 355)"/>
    <path d="M430 370c80-45 260-45 340 0" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="10" stroke-linecap="round" transform="rotate(-12 600 355)"/>
  </g>
  <circle cx="180" cy="160" r="58" fill="#ffffff" opacity="0.12"/>
  <circle cx="1000" cy="180" r="28" fill="#ffffff" opacity="0.12"/>
</svg>
